name: attach_browser_file
version: 1
description: Attach a chosen file to an HTML file input without submitting the form. Requires run-scoped approval.
inputs:
  url:
    type: string
    minLength: 1
    maxLength: 4096
    required: true
  selector:
    type: string
    minLength: 1
    maxLength: 1000
    required: true
  path:
    type: string
    minLength: 1
    maxLength: 4096
    required: true
steps:
  - id: attach_file
    tool: browser.upload_file
    args:
      url: "${inputs.url}"
      selector: "${inputs.selector}"
      path: "${inputs.path}"
